    <rect x="144" y="238" width="12" height="26" rx="6"/>
    <rect x="36" y="144" width="26" height="12" rx="6"/>
    <rect x="238" y="144" width="26" height="12" rx="6"/>
    <rect x="63" y="63" width="12" height="26" rx="6" transform="rotate(-45 69 76)"/>
    <rect x="225" y="63" width="12" height="26" rx="6" transform="rotate(45 231 76)"/>
    <rect x="63" y="211" width="12" height="26" rx="6" transform="rotate(45 69 224)"/>
    <rect x="225" y="211" width="12" height="26" rx="6" transform="rotate(-45 231 224)"/>
  </g>
